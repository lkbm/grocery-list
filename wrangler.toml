name = "grocery-list"
main = "src/main.tsx"
compatibility_date = "2026-04-14"
compatibility_flags = [ "nodejs_compat" ]


[[durable_objects.bindings]]
name = "GROCERYLIST"
class_name = "GroceryList"

[[ratelimits]]
name = "GROCERY_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

[[migrations]]
tag = "v1"
new_classes = ["GroceryList"]

[assets]
directory = "./dist"

[build]
command = "npm run build"
